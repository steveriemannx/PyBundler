[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybundler"
dynamic = ["version"]
description = "Bundle Python applications into relocatable executables. A permissively licensed PyInstaller alternative."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "steveriemannx" }, { name = "PyBundler contributors" }]
keywords = ["bundler", "packaging", "pyinstaller", "standalone", "freeze"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX :: BSD :: FreeBSD",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
# Intentionally empty: PyBundler has no runtime dependencies. Everything it
# needs ships with CPython's standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/pybundler/pybundler"
Issues = "https://github.com/pybundler/pybundler/issues"

[project.scripts]
pybundler = "pybundler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "pybundler.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybundler = ["resources/*", "hooks/*.py"]

[tool.pybundler]
# PyBundler can read its own configuration from pyproject.toml under
# [tool.pybundler]; this section only configures this repository's own build.
app = { name = "pybundler", entry = "src/pybundler/__main__.py", mode = "onedir" }
