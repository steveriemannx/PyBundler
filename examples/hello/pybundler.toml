# Tkinter GUI example: opens a window, no console window on Windows.
#
#   cd examples/hello
#   pybundler build
#   dist/hello/hello

[app]
name = "hello"
version = "1.0.0"
entry = "main.py"
mode = "onedir"
# No console window: on Windows the launcher is linked as a GUI application.
console = false

[python]
runtime = "auto"

[build]
output_dir = "dist"
work_dir = "build"
strip_sources = true
compress = true

[collect]
# The tkinter hook ships Tcl/Tk; listed explicitly for clarity and safety.
hidden_imports = ["tkinter", "_tkinter", "tkinter.ttk"]
exclude = []

[launch]
args = []
